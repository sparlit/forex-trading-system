global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'default'
  routes:
  - match:
      severity: critical
    receiver: 'critical-alerts'
    repeat_interval: 30m
  - match:
      severity: warning
    receiver: 'warning-alerts'
    repeat_interval: 2h

receivers:
- name: 'default'
  email_configs:
  - to: 'alerts@your-domain.com'
    send_resolved: true
  slack_configs:
  - api_url: '${SLACK_WEBHOOK_URL}'
    channel: '#forex-alerts'
    send_resolved: true
- name: 'critical-alerts'
  email_configs:
  - to: 'critical@your-domain.com'
    send_resolved: true
  slack_configs:
  - api_url: '${SLACK_WEBHOOK_URL}'
    channel: '#forex-critical'
    send_resolved: true
  pagerduty_configs:
  - service_key: '${PAGERDUTY_KEY}'
    severity: critical
- name: 'warning-alerts'
  email_configs:
  - to: 'warnings@your-domain.com'
    send_resolved: true
  slack_configs:
  - api_url: '${SLACK_WEBHOOK_URL}'
    channel: '#forex-warnings'
    send_resolved: true

inhibit_rules:
- source_match:
    severity: 'critical'
  target_match:
    severity: 'warning'
  equal: ['alertname', 'instance']
