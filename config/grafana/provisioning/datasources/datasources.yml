apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: InfluxDB
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    database: metrics
    jsonData:
      organization: trading
      defaultBucket: metrics
    secureJsonData:
      token: ${INFLUX_TOKEN}
    editable: false
