global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'forex-trading'
    environment: 'development'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "alerts/*.yml"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Forex Trading System API
  - job_name: 'forex-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'

  # Strategy Workers
  - job_name: 'forex-worker-strategy'
    static_configs:
      - targets: ['worker-strategy:8001']
    metrics_path: '/metrics'

  # Risk Workers
  - job_name: 'forex-worker-risk'
    static_configs:
      - targets: ['worker-risk:8002']
    metrics_path: '/metrics'

  # Execution Workers
  - job_name: 'forex-worker-execution'
    static_configs:
      - targets: ['worker-execution:8003']
    metrics_path: '/metrics'

  # Data Workers
  - job_name: 'forex-worker-data'
    static_configs:
      - targets: ['worker-data:8004']
    metrics_path: '/metrics'

  # Node Exporter (host metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']

  # cAdvisor (container metrics)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['host.docker.internal:8080']

  # TimescaleDB (PostgreSQL exporter)
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['host.docker.internal:9187']

  # Redis Exporter
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['host.docker.internal:9121']

  # NATS
  - job_name: 'nats'
    static_configs:
      - targets: ['nats:8222']
    metrics_path: '/metrics'