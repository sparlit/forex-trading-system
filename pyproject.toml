[tool.ruff.lint]
ignore = [ "BLE001", "B008", "S110", "S112", "SIM102", "SIM117", "SIM103", "B023", "ASYNC230", "ASYNC251", "F811", "DTZ901", "TRY002", "PLC0206", "PERF402",]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [ "tests",]
python_files = [ "test_*.py",]
python_classes = [ "Test*",]
python_functions = [ "test_*",]
addopts = "-v --tb=short --strict-markers"
markers = [ "unit: Unit tests", "integration: Integration tests", "slow: Slow tests", "integration: Integration tests requiring external services",]

[tool.coverage.run]
source = [ "src",]
omit = [ "tests/*", "*/migrations/*",]

[tool.coverage.report]
exclude_lines = [ "pragma: no cover", "def __repr__", "raise AssertionError", "raise NotImplementedError", "if __name__ == .__main__:",]

